<!doctype html>
<html lang="en" data-art="flat">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline · Mark Weiss</title>
    <meta name="description" content="Songs, books, films and places that have stuck with Mark Weiss, newest first." />
    <meta property="og:title" content="Timeline · Mark Weiss" />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111214'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%23f0a75a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="site.css" />
    <script>
      try { document.documentElement.dataset.art = localStorage.getItem("artStyle") || "flat"; }
      catch (e) { document.documentElement.dataset.art = "flat"; }
    </script>
  </head>

  <body>
    <div class="wrap">
      <nav class="bar" aria-label="Site">
        <a href="./">← Mark Weiss</a>
        <div class="switch" role="group" aria-label="Art style">
          <span class="label" aria-hidden="true">Art</span>
          <button type="button" data-art="flat" aria-pressed="true" title="Flat vector">Flat</button>
          <button type="button" data-art="grainy" aria-pressed="false" title="Grainy gradient">Grainy</button>
          <button type="button" data-art="collage" aria-pressed="false" title="Torn paper collage">Collage</button>
        </div>
      </nav>

      <main class="timeline">
        <header class="tl-head">
          <h1>Timeline</h1>
          <p class="muted">Songs, books, films and places that have stuck with me.</p>
        </header>
        <div class="kinds" id="kinds" role="group" aria-label="Show"></div>
        <div class="entries" id="entries"></div>
        <noscript><p class="muted">The Timeline needs JavaScript to show its posts.</p></noscript>
      </main>
    </div>

    <script src="posts.js"></script>
    <script src="site.js"></script>
  </body>
</html>
